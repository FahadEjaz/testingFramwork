name: Tests

on:
  pull_request:
  schedule:
    # Nightly full suite at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Run deterministic test suite
        run: |
          echo "::group::deterministic-run"
          npx playwright test
          echo "::endgroup::"
        # Deterministic run: zero AI tokens by design (see REQUIREMENTS.md 3.3/3.4).
        # AI-healing cost/time is logged separately once Phase 3 introduces it.

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
